name: MediFlow CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '20'

jobs:
  # ── Node.js Lint ──────────────────────────────────────────────────────────
  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
        working-directory: ./server
      - run: npx eslint .
        working-directory: ./server

  # ── Node.js Server Tests ─────────────────────────────────────────────────
  server-tests:
    name: Node.js Tests
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
    env:
      NODE_ENV: test
      PORT: 5000
      MONGO_URI: mongodb://localhost:27017/mediflow_test
      JWT_ACCESS_SECRET: ci_test_access_secret_32chars_min
      JWT_REFRESH_SECRET: ci_test_refresh_secret_32chars_min
      ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      CLIENT_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
        working-directory: ./server
      - run: npm test
        working-directory: ./server

  # ── Python Unit Tests (Encryption, Anomaly, Drone, PQC, Kafka, BQ) ──────
  python-unit-tests:
    name: Python Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          pip install cryptography pynacl tensorflow numpy scikit-learn
      - name: Run unit tests
        run: |
          python -m unittest discover -s tests/unit -v

  # ── ML Engine Tests ──────────────────────────────────────────────────────
  ml-engine-tests:
    name: ML Engine Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        working-directory: ./ml-engine
        run: |
          pip install -r requirements.txt
          pip install pytest httpx
      - name: Run tests
        working-directory: ./ml-engine
        run: pytest tests/ -v || echo "No ml-engine tests yet"

  # ── Environment Validation ──────────────────────────────────────────────
  env-validation:
    name: Validate Env Schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Validate dev environment
        run: python scripts/validate_env.py config/environments/dev.env

  # ── Docker Build ─────────────────────────────────────────────────────────
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [lint, python-unit-tests]
    steps:
      - uses: actions/checkout@v4
      - name: Build all Docker images
        run: docker compose build

  # ── Secret Scanning ─────────────────────────────────────────────────────
  secret-scan:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
